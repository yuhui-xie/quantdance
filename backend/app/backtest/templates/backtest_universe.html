<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>批量回测报告 __TITLE__</title>
<style>
:root{--bg:#0e1117;--panel:#171b24;--line:#2b3240;--text:#e8edf5;--muted:#8f9bad;--blue:#55b6ff;--green:#55d187;--red:#ff7b72;--amber:#f5bd55}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Microsoft YaHei","Segoe UI",sans-serif}
header{border-bottom:1px solid var(--line);padding:22px max(24px,calc((100% - 1440px)/2))}
h1{font-size:22px;margin:0 0 5px}.muted,.meta{color:var(--muted)}.wrap{max-width:1440px;margin:auto;padding:18px 24px 48px}
.notice{background:#242114;border:1px solid #5f5124;color:#f5d982;border-radius:8px;padding:10px 13px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:14px}
.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px}.card{padding:12px 14px}.card label{display:block;color:var(--muted);font-size:12px}.card b{font-size:19px;font-variant-numeric:tabular-nums}
.panel{padding:14px;margin-bottom:14px}.panel h2{font-size:16px;margin:0 0 11px}.charts{display:grid;grid-template-columns:2fr 1fr;gap:14px}
svg{display:block;width:100%;height:300px;background:#11151d;border:1px solid var(--line);border-radius:7px;touch-action:none}.grid{stroke:#252c38;stroke-width:1}.axis{fill:var(--muted);font-size:11px}
.chart-tools{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin:-4px 0 7px}.chart-tools span{color:var(--muted);font-size:12px;margin-right:auto}.chart-tools button{background:#10141c;border:1px solid var(--line);color:var(--text);border-radius:5px;padding:3px 9px;cursor:pointer}.chart-tools button:hover{border-color:var(--blue)}
.chart-tooltip{display:none;position:fixed;z-index:30;pointer-events:none;min-width:150px;padding:8px 10px;background:#090c12ed;border:1px solid #465267;border-radius:6px;box-shadow:0 5px 18px #0008;font-size:12px;font-variant-numeric:tabular-nums}.chart-tooltip b{display:block;margin-bottom:3px}.chart-tooltip div{display:flex;justify-content:space-between;gap:18px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}input,select{background:#10141c;border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:6px}
input{min-width:220px}.scroll{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:7px}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}th,td{padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
th{position:sticky;top:0;background:#1c212c;color:var(--muted);cursor:pointer;z-index:1}th:nth-child(1),th:nth-child(2),td:nth-child(1),td:nth-child(2){text-align:left}
tbody tr[data-symbol]{cursor:pointer}tbody tr[data-symbol]:hover{background:#202735}.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--amber)}
.pill{padding:2px 6px;border-radius:10px;background:#273040;color:#cbd5e1}.detail{color:var(--blue)}
.modal-mask{display:none;position:fixed;inset:0;background:#000b;z-index:10;padding:24px;align-items:center;justify-content:center}.modal-mask.open{display:flex}
.modal{width:min(1100px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.modal-head{display:flex;justify-content:space-between;gap:15px}.modal-head h2{margin:0}.close{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer}
.mini-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px;margin:12px 0}.mini-stats div{background:#11151d;padding:9px;border-radius:6px}.mini-stats small{display:block;color:var(--muted)}
.detail-charts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail-charts svg{height:270px}.indicator-section{margin-top:12px}.indicator-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.indicator-grid h4{margin:0 0 7px;color:var(--muted)}.indicator-grid svg{height:240px}.tables{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.tables .scroll{max-height:260px}
.empty{padding:18px;color:var(--muted)}footer{color:var(--muted);font-size:12px;margin-top:16px}
@media(max-width:900px){.charts,.detail-charts,.indicator-grid,.tables{grid-template-columns:1fr}.wrap{padding:12px}.modal-mask{padding:8px}}
</style>
</head>
<body>
<header><h1>独立资金批量回测报告</h1><div class="meta" id="meta"></div></header>
<main class="wrap">
  <div class="notice">本报告将每只股票视为独立账户；“等权汇总”是归一化净值的统计合成，不代表可实际成交的共享资金组合。</div>
  <section class="stats" id="stats"></section>
  <section class="charts">
    <div class="panel"><h2>等权汇总净值与回撤</h2><svg id="aggregateChart"></svg></div>
    <div class="panel"><h2>单票收益分布</h2><svg id="histChart"></svg></div>
  </section>
  <section class="panel">
    <h2>全量结果排行</h2>
    <div class="toolbar">
      <input id="search" placeholder="搜索代码、名称或状态">
      <select id="status"><option value="">全部状态</option><option value="ok">成功</option><option value="skipped">跳过</option><option value="failed">失败</option></select>
      <span class="muted" id="count"></span>
    </div>
    <div class="scroll"><table>
      <thead><tr>
        <th data-key="rank">排名</th><th data-key="symbol">代码 / 名称</th><th data-key="status">状态</th>
        <th data-key="total_return">总收益</th><th data-key="annualized_return">年化</th><th data-key="max_drawdown">最大回撤</th>
        <th data-key="sharpe">Sharpe</th><th data-key="return_drawdown_ratio">收益/回撤</th><th data-key="num_trades">交易</th>
        <th data-key="win_rate">胜率</th><th data-key="profit_factor">盈亏比</th><th>明细</th>
      </tr></thead><tbody id="ranking"></tbody>
    </table></div>
    <div class="muted" style="margin-top:8px">全部 <span id="detailLimit"></span> 个成功结果均可查看逐票净值、成交和 FIFO 回合盈亏；前 <span id="priceDetailLimit"></span> 名额外补充行情数据。</div>
  </section>
  <footer id="footer"></footer>
</main>
<div class="modal-mask" id="modal"><div class="modal">
  <div class="modal-head"><div><h2 id="detailTitle"></h2><div class="muted" id="detailSub"></div></div><button class="close" id="close">关闭</button></div>
  <div class="mini-stats" id="detailStats"></div>
  <div class="detail-charts"><div><h3>个股净值与回撤</h3><svg id="detailEquity"></svg></div><div><h3>行情、指标与买卖点</h3><svg id="detailPrice"></svg></div></div>
  <div class="indicator-section"><h3>策略指标</h3><div class="indicator-grid" id="detailIndicators"></div></div>
  <div class="tables"><div><h3>成交明细</h3><div class="scroll"><table><thead><tr><th>日期</th><th>方向</th><th>价格</th><th>股数</th><th>金额</th></tr></thead><tbody id="tradeRows"></tbody></table></div></div>
  <div><h3>已闭合回合（FIFO）</h3><div class="scroll"><table><thead><tr><th>买入</th><th>卖出</th><th>股数</th><th>收益</th><th>盈亏</th></tr></thead><tbody id="tripRows"></tbody></table></div></div></div>
</div></div>
<div class="chart-tooltip" id="chartTooltip"></div>
<script>
const DATA=__DATA__;
const $=id=>document.getElementById(id);
const num=(v,d=2)=>v==null||!Number.isFinite(Number(v))?"-":Number(v).toFixed(d);
const pct=v=>v==null||!Number.isFinite(Number(v))?"-":`${(Number(v)*100).toFixed(2)}%`;
const cls=v=>Number(v)>0?"pos":Number(v)<0?"neg":"";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const M=DATA.aggregate.metrics||{},S=DATA.summary||{};
$("meta").textContent=`策略 ${DATA.strategy_id} · ${DATA.universe_note||"未注明股票池"}`;
const statItems=[
 ["等权总收益",pct(M.total_return),cls(M.total_return)],["等权年化",pct(M.annualized_return),cls(M.annualized_return)],
 ["等权最大回撤",pct(M.max_drawdown),"neg"],["等权 Sharpe",num(M.sharpe),""],
 ["成功 / 请求",`${S.succeeded||0} / ${S.requested||0}`,""],["单票平均收益",pct(S.average_total_return),cls(S.average_total_return)],
 ["单票平均回撤",pct(S.average_max_drawdown),"neg"],["正收益股票",`${DATA.distribution.positive||0} 只`,"pos"]
];
$("stats").innerHTML=statItems.map(x=>`<div class="card"><label>${x[0]}</label><b class="${x[2]}">${x[1]}</b></div>`).join("");
$("detailLimit").textContent=DATA.detail_limit;
$("priceDetailLimit").textContent=DATA.price_detail_limit;
$("footer").textContent=[...(DATA.warnings||[]),DATA.disclaimer].filter(Boolean).join(" · ");

function svgBase(svg){
 const w=Math.max(500,svg.clientWidth||800),h=svg.clientHeight||300,p={l:52,r:18,t:18,b:30};
 svg.setAttribute("viewBox",`0 0 ${w} ${h}`);svg.innerHTML="";
 return {w,h,p,iw:w-p.l-p.r,ih:h-p.t-p.b};
}
const chartStates=new WeakMap(),activeCharts=new Set(),tooltip=$("chartTooltip");
function clampWindow(state,start,end){
 const max=Math.max(0,state.series.length-1),span=Math.min(max,Math.max(1,end-start));
 start=Math.max(0,Math.min(start,max-span));return [start,start+span];
}
function renderLineChart(svg){
 const state=chartStates.get(svg),series=state.series,fields=state.fields,markers=state.markers,z=svgBase(svg);
 state.z=z;
 if(!series.length){svg.innerHTML='<text x="20" y="35" fill="#8f9bad">无可用序列</text>';return}
 const lo=Math.max(0,Math.floor(state.start)),hi=Math.min(series.length-1,Math.ceil(state.end));
 const visible=series.slice(lo,hi+1),all=fields.flatMap(f=>visible.map(r=>Number(r[f.key])).filter(Number.isFinite));
 if(!all.length){svg.innerHTML='<text x="20" y="35" fill="#8f9bad">无可用序列</text>';return}
 let min=Math.min(...all),max=Math.max(...all);if(min===max){min-=.01;max+=.01}const pad=(max-min)*.08;min-=pad;max+=pad;
 const x=i=>z.p.l+(state.end===state.start?z.iw/2:(i-state.start)*z.iw/(state.end-state.start)),y=v=>z.p.t+(max-v)*z.ih/(max-min);
 state.x=x;state.y=y;
 for(let i=0;i<5;i++){const yy=z.p.t+i*z.ih/4,val=max-i*(max-min)/4;svg.innerHTML+=`<line class="grid" x1="${z.p.l}" y1="${yy}" x2="${z.w-z.p.r}" y2="${yy}"/><text class="axis" x="4" y="${yy+4}">${num(val,2)}</text>`}
 fields.forEach(f=>{const pts=[];for(let i=lo;i<=hi;i++){const v=Number(series[i][f.key]);if(Number.isFinite(v))pts.push(`${x(i)},${y(v)}`)}svg.innerHTML+=`<polyline fill="none" stroke="${f.color}" stroke-width="2" points="${pts.join(" ")}"/>`});
 [lo,Math.round((lo+hi)/2),hi].forEach((i,j)=>svg.innerHTML+=`<text class="axis" text-anchor="${j===0?"start":j===2?"end":"middle"}" x="${x(i)}" y="${z.h-8}">${esc(series[i].date||"")}</text>`);
 markers.forEach(m=>{let i=series.findIndex(r=>r.date>=m.date);if(i<lo||i>hi)return;const value=Number(series[i][fields[0].key]);if(Number.isFinite(value))svg.innerHTML+=`<circle cx="${x(i)}" cy="${y(value)}" r="4" fill="${m.side==="buy"?"#55d187":"#ff7b72"}"><title>${esc(m.date)} ${m.side==="buy"?"买入":"卖出"}</title></circle>`});
}
function zoomChart(svg,factor,anchor=.5){
 const s=chartStates.get(svg);if(!s||s.series.length<3)return;const span=s.end-s.start,newSpan=Math.max(2,Math.min(s.series.length-1,span*factor));
 [s.start,s.end]=clampWindow(s,s.start+(span-newSpan)*anchor,s.start+(span-newSpan)*anchor+newSpan);renderLineChart(svg);
}
function resetChart(svg){const s=chartStates.get(svg);if(!s)return;s.start=0;s.end=Math.max(0,s.series.length-1);renderLineChart(svg)}
function pointerIndex(svg,e){
 const s=chartStates.get(svg),rect=svg.getBoundingClientRect(),local=(e.clientX-rect.left)*s.z.w/rect.width;
 const ratio=Math.max(0,Math.min(1,(local-s.z.p.l)/s.z.iw));return Math.max(0,Math.min(s.series.length-1,Math.round(s.start+ratio*(s.end-s.start))));
}
function showPoint(svg,e){
 const s=chartStates.get(svg);if(!s||!s.series.length||s.drag)return;const i=pointerIndex(svg,e),row=s.series[i],xx=s.x(i);
 svg.querySelector(".hover-layer")?.remove();svg.insertAdjacentHTML("beforeend",`<g class="hover-layer"><line x1="${xx}" y1="${s.z.p.t}" x2="${xx}" y2="${s.z.h-s.z.p.b}" stroke="#8f9bad" stroke-dasharray="4 3"/>${s.fields.map(f=>{const v=Number(row[f.key]);return Number.isFinite(v)?`<circle cx="${xx}" cy="${s.y(v)}" r="4" fill="${f.color}" stroke="#fff"/>`:""}).join("")}</g>`);
 tooltip.innerHTML=`<b>${esc(row.date||`第 ${i+1} 点`)}</b>${s.fields.map(f=>`<div><span style="color:${f.color}">${esc(f.label||f.key)}</span><strong>${f.format==="pct"?pct(row[f.key]):num(row[f.key],4)}</strong></div>`).join("")}`;
 tooltip.style.display="block";const tw=tooltip.offsetWidth,th=tooltip.offsetHeight;tooltip.style.left=`${Math.min(innerWidth-tw-8,e.clientX+14)}px`;tooltip.style.top=`${Math.max(8,Math.min(innerHeight-th-8,e.clientY+14))}px`;
}
function installChartInteraction(svg){
 if(svg.dataset.interactive)return;svg.dataset.interactive="1";
 const tools=document.createElement("div");tools.className="chart-tools";tools.innerHTML='<span>滚轮缩放 · 拖拽平移 · 悬停查看</span><button data-z=".7">＋</button><button data-z="1.4">－</button><button data-reset>重置</button>';svg.before(tools);
 tools.querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>zoomChart(svg,Number(b.dataset.z)));tools.querySelector("[data-reset]").onclick=()=>resetChart(svg);
 svg.addEventListener("wheel",e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomChart(svg,e.deltaY>0?1.25:.8,(e.clientX-r.left)/r.width)},{passive:false});
 svg.addEventListener("pointerdown",e=>{const s=chartStates.get(svg);s.drag={x:e.clientX,start:s.start,end:s.end};svg.setPointerCapture(e.pointerId)});
 svg.addEventListener("pointermove",e=>{const s=chartStates.get(svg);if(!s.drag){showPoint(svg,e);return}const r=svg.getBoundingClientRect(),shift=-(e.clientX-s.drag.x)/r.width*(s.drag.end-s.drag.start);[s.start,s.end]=clampWindow(s,s.drag.start+shift,s.drag.end+shift);renderLineChart(svg)});
 const stop=()=>{const s=chartStates.get(svg);if(s)s.drag=null};svg.addEventListener("pointerup",stop);svg.addEventListener("pointercancel",stop);
 svg.addEventListener("mouseleave",()=>{tooltip.style.display="none";svg.querySelector(".hover-layer")?.remove()});svg.addEventListener("dblclick",()=>resetChart(svg));
}
function lineChart(svg,series,fields,markers=[]){
 chartStates.set(svg,{series,fields,markers,start:0,end:Math.max(0,series.length-1),drag:null});activeCharts.add(svg);installChartInteraction(svg);renderLineChart(svg);
}
function histogram(svg,values){
 const z=svgBase(svg), vals=values.map(Number).filter(Number.isFinite);if(!vals.length){svg.innerHTML='<text x="20" y="35" fill="#8f9bad">无可用收益数据</text>';return}
 let min=Math.min(...vals),max=Math.max(...vals);if(min===max){min-=.01;max+=.01}const n=Math.min(16,Math.max(6,Math.ceil(Math.sqrt(vals.length)))),step=(max-min)/n,bins=Array(n).fill(0);
 vals.forEach(v=>bins[Math.min(n-1,Math.floor((v-min)/step))]++);const peak=Math.max(...bins,1),bw=z.iw/n;
 bins.forEach((v,i)=>{const bh=v/peak*(z.ih-18),start=min+i*step;svg.innerHTML+=`<rect x="${z.p.l+i*bw+1}" y="${z.p.t+z.ih-bh}" width="${Math.max(1,bw-2)}" height="${bh}" fill="${start>=0?"#55d187":"#ff7b72"}" opacity=".8"><title>${pct(start)} ~ ${pct(start+step)}: ${v}只</title></rect>`});
 svg.innerHTML+=`<text class="axis" x="${z.p.l}" y="${z.h-8}">${pct(min)}</text><text class="axis" text-anchor="end" x="${z.w-z.p.r}" y="${z.h-8}">${pct(max)}</text>`;
}
lineChart($("aggregateChart"),DATA.aggregate.equity||[],[{key:"nav",label:"净值",color:"#55b6ff"},{key:"drawdown",label:"回撤",color:"#ff7b72",format:"pct"}]);
histogram($("histChart"),DATA.distribution.returns||[]);

let rows=[...(DATA.ranked_index||[])],sortKey="rank",sortDir=1;
function cell(v,format=num){return v==null?"-":format(v)}
function renderRows(){
 const q=$("search").value.trim().toLowerCase(),status=$("status").value;
 let filtered=rows.filter(r=>(!status||r.status===status)&&(!q||`${r.symbol} ${r.name} ${r.status} ${r.reason||""}`.toLowerCase().includes(q)));
 filtered.sort((a,b)=>{let x=a[sortKey],y=b[sortKey];if(x==null)x=sortDir>0?Infinity:-Infinity;if(y==null)y=sortDir>0?Infinity:-Infinity;return (typeof x==="string"?x.localeCompare(y):(x-y))*sortDir});
 $("count").textContent=`显示 ${filtered.length} / ${rows.length}`;
 $("ranking").innerHTML=filtered.map(r=>{const detail=DATA.details[r.symbol];return `<tr data-symbol="${esc(r.symbol)}">
 <td>${r.rank??"-"}</td><td><b>${esc(r.symbol)}</b> <span class="muted">${esc(r.name)}</span></td><td><span class="pill">${esc(r.status)}</span>${r.reason?` <span class="warn" title="${esc(r.reason)}">!</span>`:""}</td>
 <td class="${cls(r.total_return)}">${cell(r.total_return,pct)}</td><td class="${cls(r.annualized_return)}">${cell(r.annualized_return,pct)}</td><td class="neg">${cell(r.max_drawdown,pct)}</td>
 <td>${cell(r.sharpe)}</td><td>${cell(r.return_drawdown_ratio)}</td><td>${cell(r.num_trades,v=>num(v,0))}</td><td>${cell(r.win_rate,pct)}</td><td>${cell(r.profit_factor)}</td>
 <td class="${detail?"detail":"muted"}">${detail?"查看":"指标"}</td></tr>`}).join("");
 document.querySelectorAll("tbody#ranking tr").forEach(tr=>tr.onclick=()=>openDetail(tr.dataset.symbol));
}
$("search").oninput=renderRows;$("status").onchange=renderRows;
document.querySelectorAll("th[data-key]").forEach(th=>th.onclick=()=>{if(sortKey===th.dataset.key)sortDir*=-1;else{sortKey=th.dataset.key;sortDir=1}renderRows()});
renderRows();

function openDetail(symbol){
 const d=DATA.details[symbol];if(!d)return;
 $("detailTitle").textContent=`#${d.rank} ${d.symbol} ${d.name||""}`;$("detailSub").textContent=`成交 ${d.trades.length} 笔 · 已闭合回合 ${d.round_trips.length} 个`;
 const m=d.metrics||{};$("detailStats").innerHTML=[["总收益",pct(m.total_return),cls(m.total_return)],["年化",pct(m.annualized_return),cls(m.annualized_return)],["最大回撤",pct(m.max_drawdown),"neg"],["Sharpe",num(m.sharpe),""],["胜率",pct(m.win_rate),""],["盈亏比",num(m.profit_factor),""]].map(x=>`<div><small>${x[0]}</small><b class="${x[2]}">${x[1]}</b></div>`).join("");
 lineChart($("detailEquity"),d.equity||[],[{key:"nav",label:"净值",color:"#55b6ff"},{key:"drawdown",label:"回撤",color:"#ff7b72",format:"pct"}],d.trades);
 const indicatorSeries=d.indicator_series||[],indicatorsByDate=new Map(indicatorSeries.map(r=>[r.date,r]));
 const price=(d.prices||[]).map(r=>({date:r[0],close:r.length>=5?r[4]:r[1],...(indicatorsByDate.get(r[0])||{})}));
 lineChart($("detailPrice"),price,[{key:"close",label:"收盘价",color:"#f5bd55"},...(d.price_overlay_fields||[])],d.trades);
 const indicatorRoot=$("detailIndicators");indicatorRoot.querySelectorAll("svg").forEach(svg=>activeCharts.delete(svg));indicatorRoot.innerHTML="";
 const charts=d.indicator_charts||[];
 if(!charts.length){indicatorRoot.innerHTML='<div class="empty">无可用策略指标；重新批量回测时请启用价格/指标明细。</div>'}
 else charts.forEach((chart,index)=>{const box=document.createElement("div");box.innerHTML=`<h4>${esc(chart.title||`指标 ${index+1}`)}</h4><svg></svg>`;indicatorRoot.appendChild(box);lineChart(box.querySelector("svg"),indicatorSeries,chart.fields||[])});
 $("tradeRows").innerHTML=d.trades.length?d.trades.map(t=>`<tr><td>${esc(t.date)}</td><td class="${t.side==="buy"?"pos":"neg"}">${t.side==="buy"?"买入":"卖出"}</td><td>${num(t.price)}</td><td>${num(t.shares,0)}</td><td>${num(t.notional)}</td></tr>`).join(""):'<tr><td colspan="5" class="empty">无成交</td></tr>';
 $("tripRows").innerHTML=d.round_trips.length?d.round_trips.map(t=>`<tr><td>${esc(t.buy_date)}</td><td>${esc(t.sell_date)}</td><td>${num(t.shares,0)}</td><td class="${cls(t.pnl_pct)}">${pct(t.pnl_pct)}</td><td class="${cls(t.pnl)}">${num(t.pnl)}</td></tr>`).join(""):'<tr><td colspan="5" class="empty">无已闭合回合</td></tr>';
 $("modal").classList.add("open");
}
